<head>

  <meta charset="UTF-8" />

  <title>TOF Buff Categories &amp; Stacking</title>
  <script>
    (function () {
      const savedTheme = document.cookie
        .split("; ")
        .find((entry) => entry.startsWith("tof-multype-theme="))
        ?.split("=")[1];
      document.documentElement.dataset.multypeTheme = savedTheme === "dark" ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="../shared/fonts.css" />
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/header.css" />
  <link rel="stylesheet" href="./styles/datamine-multype.css" />
</head>
<body class="page page--datamine-multype">
  <div class="noise-bg"></div>
  <div data-datamine-header data-current="multype"></div>
  <div class="multype-theme-bar">
    <div class="multype-theme-control">
      <span class="multype-theme-control__label" data-multype-theme-label>Table palette</span>
      <div class="multype-theme-switch" role="group" aria-label="Table color theme" data-multype-theme-switch>
        <button class="multype-theme-switch__button" type="button" data-multype-theme-value="light">
          <svg class="multype-theme-switch__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.5"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
          </svg>
          <span data-multype-theme-button-label>Light</span>
        </button>
        <button class="multype-theme-switch__button" type="button" data-multype-theme-value="dark">
          <svg class="multype-theme-switch__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.2 15.2A8.6 8.6 0 0 1 8.8 3.8 8.6 8.6 0 1 0 20.2 15.2Z"></path>
          </svg>
          <span data-multype-theme-button-label>Dark</span>
        </button>
      </div>
    </div>
    <aside class="multype-version-card" aria-live="polite">
      <span class="multype-version-card__label" data-multype-version-label>Dataset version</span>
      <strong class="multype-version-card__text" data-multype-version>Loading version information…</strong>
    </aside>
  </div>
  <main class="layout multype-layout" data-multype-app></main>

  <script src="../shared/header.js?server-cache=1"></script>
  <script src="./js/datamine-multype-theme.js"></script>
  <script src="./js/datamine-multype-core.js"></script>
  <script src="./js/datamine-multype.js"></script>
  <script src="../shared/scroll-top.js"></script>
</body>
</html>
