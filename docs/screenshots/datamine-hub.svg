<svg width="1549" height="503" viewBox="0 0 1549 503" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1549" y2="503" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D1730"/>
      <stop offset="1" stop-color="#08090F"/>
    </linearGradient>
    <linearGradient id="panel" x1="22" y1="18" x2="1527" y2="485" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090A12" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#05060B"/>
    </linearGradient>
    <linearGradient id="cardFce" x1="40" y1="101" x2="398" y2="451" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A291B"/>
      <stop offset="1" stop-color="#111117"/>
    </linearGradient>
    <linearGradient id="cardSeq" x1="411" y1="101" x2="769" y2="451" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102028"/>
      <stop offset="1" stop-color="#091015"/>
    </linearGradient>
    <linearGradient id="cardMultype" x1="783" y1="101" x2="1141" y2="451" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172814"/>
      <stop offset="1" stop-color="#09100B"/>
    </linearGradient>
    <linearGradient id="cardItems" x1="1154" y1="101" x2="1512" y2="451" gradientUnits="userSpaceOnUse">
      <stop stop-color="#291624"/>
      <stop offset="1" stop-color="#110B13"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1549" height="503" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1549" height="503" rx="0" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="16" y="16" width="1517" height="459" rx="22" fill="url(#panel)" stroke="#2A2B35"/>
  </g>

  <text x="40" y="58" fill="#F4F4F8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Projects</text>
  <text x="40" y="78" fill="#BFC2D3" font-family="Segoe UI, Arial, sans-serif" font-size="12">Each page focuses on a sertain info.</text>

  <g>
    <rect x="40" y="101" width="358" height="350" rx="24" fill="url(#cardFce)" stroke="#4A4345"/>
    <text x="61" y="133" fill="#F2D565" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.8">FCE</text>
    <text x="309" y="134" fill="#D0D2DD" font-family="Consolas, monospace" font-size="12" letter-spacing="1.2">32 BOSSES</text>
    <text x="61" y="176" fill="#F5F5F7" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Boss mechanics cards</text>
    <text x="61" y="227" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Visual boss cards with condensed mechanic notes,</text>
    <text x="61" y="260" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">highlighted damage reduction, PNG export for</text>
    <text x="61" y="293" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">sharing.</text>
    <text x="64" y="334" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Switcher between all available bosses</text>
    <text x="64" y="361" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">• English and Russian text sets</text>
    <text x="64" y="388" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Direct card download as image</text>
    <rect x="62" y="383" width="104" height="48" rx="24" fill="#272417" stroke="#8F7B35"/>
    <text x="80" y="412" fill="#FFF6D4" font-family="Segoe UI, Arial, sans-serif" font-size="14">Open page</text>
  </g>

  <g>
    <rect x="411" y="101" width="358" height="350" rx="24" fill="url(#cardSeq)" stroke="#38464E"/>
    <text x="432" y="133" fill="#F2D565" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.6">SEQUENTIAL</text>
    <text x="687" y="134" fill="#D0D2DD" font-family="Consolas, monospace" font-size="12" letter-spacing="1.2">FLOOR 31</text>
    <text x="432" y="172" fill="#F5F5F7" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Boss scaling charts</text>
    <text x="432" y="223" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Charts and table views built from datamined</text>
    <text x="432" y="256" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">monster stats. The page compares pure HP,</text>
    <text x="432" y="289" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">approximated effective HP, and stage-to-stage</text>
    <text x="432" y="322" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">powercreep.</text>
    <text x="435" y="344" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Interactive chart zoom and export buttons</text>
    <text x="435" y="371" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Direct link to the raw monster data file</text>
    <text x="435" y="398" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Table preview for loaded stage values</text>
    <rect x="433" y="383" width="104" height="48" rx="24" fill="#272417" stroke="#8F7B35"/>
    <text x="451" y="412" fill="#FFF6D4" font-family="Segoe UI, Arial, sans-serif" font-size="14">Open page</text>
  </g>

  <g>
    <rect x="782" y="101" width="358" height="350" rx="24" fill="url(#cardMultype)" stroke="#364937"/>
    <text x="803" y="137" fill="#F2D565" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.8">MULTYPE</text>
    <text x="1041" y="138" fill="#D0D2DD" font-family="Consolas, monospace" font-size="12" letter-spacing="1.2">9,261 BUFFS</text>
    <text x="803" y="181" fill="#F5F5F7" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Renamed datamine viewer</text>
    <text x="803" y="228" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">The public page shows the datamine with ready-</text>
    <text x="803" y="256" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">made renames. Total: 9,261 buffs.</text>
    <text x="806" y="319" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Buffs from the game split into categories</text>
    <text x="806" y="346" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Ready-made renames on the public page</text>
    <text x="806" y="373" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Fast search across original keys and renamed labels</text>
    <rect x="804" y="377" width="104" height="48" rx="24" fill="#272417" stroke="#8F7B35"/>
    <text x="822" y="406" fill="#FFF6D4" font-family="Segoe UI, Arial, sans-serif" font-size="14">Open page</text>
  </g>

  <g>
    <rect x="1153" y="101" width="358" height="350" rx="24" fill="url(#cardItems)" stroke="#463745"/>
    <text x="1174" y="137" fill="#F2D565" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.8">ITEMS</text>
    <text x="1407" y="138" fill="#D0D2DD" font-family="Consolas, monospace" font-size="12" letter-spacing="1.2">12,754 ITEMS</text>
    <text x="1174" y="181" fill="#F5F5F7" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Item id and name table</text>
    <text x="1174" y="228" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Public table of Tower of Fantasy item ids with</text>
    <text x="1174" y="256" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">original Chinese developer names and rename</text>
    <text x="1174" y="284" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">fields for translated labels.</text>
    <text x="1177" y="344" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Fast filter across name, original, and rename</text>
    <text x="1177" y="371" fill="#D3D5E0" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Click any id to copy it instantly</text>
    <rect x="1175" y="383" width="104" height="48" rx="24" fill="#272417" stroke="#8F7B35"/>
    <text x="1193" y="412" fill="#FFF6D4" font-family="Segoe UI, Arial, sans-serif" font-size="14">Open page</text>
  </g>
</svg>
