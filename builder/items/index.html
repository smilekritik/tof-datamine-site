<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="../../datamine/favicon.svg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Local editor for TOF item renames (Gacha + MMO), with drop-in JSON export." />
  <meta name="theme-color" content="#0c0812" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Items Rename Editor</title>
  <link rel="stylesheet" href="../../datamine/shared/fonts.css" />
  <link rel="stylesheet" href="../../datamine/shared/base.css" />
  <link rel="stylesheet" href="../../datamine/items/styles/items.css" />
  <style>
    /* ==== Builder header (self-contained, matches the other builders) ==== */
    :root { --itb-gold: #f5d97a; --itb-gold-deep: #e5a93b; }
    .itb-header {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap;
      padding: 10px 20px;
      background: rgba(15, 10, 22, 0.88);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
    }
    .itb-brand { display: flex; align-items: baseline; gap: 9px; }
    .itb-brand__badge {
      display: inline-flex; align-items: center; padding: 3px 8px;
      background: linear-gradient(135deg, var(--itb-gold), var(--itb-gold-deep));
      color: #17111f; font-weight: 800; font-size: 11px; border-radius: 4px;
      letter-spacing: 0.08em; transform: translateY(-1px);
    }
    .itb-brand__title { color: #f4eefb; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    .itb-brand__sub { color: rgba(244, 238, 251, 0.5); font-size: 12px; font-weight: 600; }
    .itb-header__right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .itb-count { color: rgba(244, 238, 251, 0.5); font-size: 12px; font-weight: 600; }
    .itb-lang { display: inline-flex; border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 999px; overflow: hidden; }
    .itb-lang__btn {
      appearance: none; background: transparent; border: 0;
      color: rgba(244, 238, 251, 0.7); font: inherit; font-size: 12px; font-weight: 700;
      padding: 5px 12px; cursor: pointer;
    }
    .itb-lang__btn.is-active { background: rgba(245, 217, 122, 0.16); color: var(--itb-gold); }
    .itb-btn {
      appearance: none; display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f4eefb; font: inherit; font-size: 13px; font-weight: 600;
      padding: 7px 14px; border-radius: 8px; cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .itb-btn:hover { border-color: rgba(255, 255, 255, 0.28); background: rgba(255, 255, 255, 0.07); }
    .itb-btn--primary { background: rgba(245, 217, 122, 0.08); border-color: var(--itb-gold); color: var(--itb-gold); }
    .itb-btn--primary:hover { background: rgba(245, 217, 122, 0.16); }
    .itb-toast {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 130;
      background: rgba(18, 10, 26, 0.96); border: 1px solid rgba(79, 227, 193, 0.4);
      color: #cbeee4; font: 600 12.5px/1.3 "Manrope", sans-serif;
      padding: 9px 16px; border-radius: 10px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      opacity: 0; transition: opacity 0.2s ease; pointer-events: none;
    }
    .itb-toast.is-visible { opacity: 1; }
    @media (max-width: 720px) { .itb-header { justify-content: center; } }
  </style>
</head>
<body class="page page--datamine-items page--datamine-items-local">
  <div class="noise-bg"></div>

  <header class="itb-header">
    <div class="itb-brand">
      <span class="itb-brand__badge">IT</span>
      <span class="itb-brand__title">Rename Editor</span>
      <span class="itb-brand__sub">Items</span>
    </div>
    <div class="itb-header__right">
      <span class="itb-count" data-itb-count>No local edits</span>
      <div class="itb-lang" role="group" aria-label="Language">
        <button class="itb-lang__btn is-active" type="button" data-itb-lang="en">EN</button>
        <button class="itb-lang__btn" type="button" data-itb-lang="ru">RU</button>
      </div>
      <button class="itb-btn" type="button" data-itb-action="reset">Reset draft</button>
      <button class="itb-btn" type="button" data-itb-action="import">Import JSON</button>
      <button class="itb-btn itb-btn--primary" type="button" data-itb-action="export"
              title="Downloads the mapping file for the active source — replace datamine/items/data/… and redeploy">&#x2913; Export JSON</button>
      <input type="file" accept="application/json,.json" data-itb-file hidden />
    </div>
  </header>

  <main class="layout items-layout" data-items-app></main>

  <script src="../../datamine/items/js/items-core.js"></script>
  <script src="./js/boot.js"></script>
</body>
</html>
