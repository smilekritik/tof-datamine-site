<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="../../datamine/favicon.svg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Local editor for TOF item renames (Gacha + MMO), with drop-in JSON export." />
  <meta name="theme-color" content="#0c0812" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Items Rename Editor</title>
  <link rel="stylesheet" href="../../datamine/shared/fonts.css" />
  <link rel="stylesheet" href="../../datamine/shared/base.css" />
  <link rel="stylesheet" href="../../datamine/items/styles/items.css" />
  <link rel="stylesheet" href="../shared/builder.css" />
  <style>
    /* Bridge toast selector to shared toast styles */
    .itb-toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 130;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--db-radius-md);
      background: rgba(18, 12, 25, 0.96);
      border: 1px solid rgba(127, 210, 175, 0.4);
      color: #cbeee4;
      font-family: var(--db-font-ui);
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.3;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    .itb-toast.is-visible {
      opacity: 1;
    }
  </style>
</head>
<body class="page page--datamine-items page--datamine-items-local">
  <div class="noise-bg"></div>

  <header class="db-header">
    <div class="db-header__left">
      <a class="db-brand" href="../">
        <span class="db-code">ITEMS</span>
        <h1 class="db-title">Item Rename Editor</h1>
        <span class="db-sub">Items</span>
      </a>
    </div>
    <div class="db-header__right">
      <span class="db-count" data-itb-count>No local edits</span>
      <div class="db-lang" role="group" aria-label="Language">
        <button class="db-lang__btn is-active" type="button" data-itb-lang="en">EN</button>
        <button class="db-lang__btn" type="button" data-itb-lang="ru">RU</button>
      </div>
      <button class="db-btn" type="button" data-itb-action="reset">Reset draft</button>
      <button class="db-btn" type="button" data-itb-action="import">Import JSON</button>
      <button class="db-btn db-btn--primary" type="button" data-itb-action="export"
              title="Downloads the mapping file for the active source — replace datamine/items/data/… and redeploy">&#x2913; Export JSON</button>
      <input type="file" accept="application/json,.json" data-itb-file hidden />
    </div>
  </header>

  <main class="layout items-layout" data-items-app></main>

  <script src="../../datamine/items/js/items-core.js"></script>
  <script src="./js/boot.js"></script>
</body>
</html>
