<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="../../datamine/favicon.svg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Local editor for TOF Multype category and file renames, with JSON export." />
  <meta name="theme-color" content="#0c0812" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Multype Rename Editor</title>
  <script>
    (function () {
      const savedTheme = document.cookie
        .split("; ")
        .find((entry) => entry.startsWith("tof-multype-theme="))
        ?.split("=")[1];
      document.documentElement.dataset.multypeTheme = savedTheme === "dark" ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="../../datamine/shared/fonts.css" />
  <link rel="stylesheet" href="../../datamine/shared/base.css" />
  <link rel="stylesheet" href="../../datamine/multype/styles/datamine-multype.css" />
  <link rel="stylesheet" href="../shared/builder.css" />
  <style>
    /* In local editor mode, hide the duplicated in-body action buttons */
    .page--datamine-multype-local .multype-toolbar__row--actions {
      display: none !important;
    }
  </style>
</head>
<body class="page page--datamine-multype page--datamine-multype-local">
  <div class="noise-bg"></div>

  <header class="db-header">
    <div class="db-header__left">
      <a class="db-brand" href="../">
        <span class="db-code">MULTYPE</span>
        <h1 class="db-title">Rename Editor</h1>
        <span class="db-sub">Multype</span>
      </a>
    </div>
    <div class="db-header__right">
      <div class="multype-theme-switch" role="group" aria-label="Theme mode" style="margin: 0;">
        <button class="multype-theme-switch__button is-active" type="button" data-action="set-theme" data-theme="light" aria-pressed="true">
          <svg class="multype-theme-switch__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
          <span>Light</span>
        </button>
        <button class="multype-theme-switch__button" type="button" data-action="set-theme" data-theme="dark" aria-pressed="false">
          <svg class="multype-theme-switch__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
          <span>Dark</span>
        </button>
      </div>
      <div class="db-lang" role="group" aria-label="Language">
        <button class="db-lang__btn is-active" type="button" data-mtb-lang="en">EN</button>
        <button class="db-lang__btn" type="button" data-mtb-lang="ru">RU</button>
      </div>
      <button class="db-btn" type="button" data-mtb-action="reset">Reset draft</button>
      <button class="db-btn" type="button" data-mtb-action="import">Import JSON</button>
      <button class="db-btn db-btn--primary" type="button" data-mtb-action="export"
              title="Downloads renames.base.json — replace datamine/multype/data/renames.base.json and redeploy">&#x2913; Export JSON</button>
    </div>
  </header>

  <main class="layout multype-layout" data-multype-app></main>

  <script src="../../datamine/shared/header.js"></script>
  <script src="../../datamine/multype/js/multype-column-window.js"></script>
  <script src="../../datamine/multype/js/datamine-multype-core.js"></script>
  <script src="./js/boot.js"></script>
</body>
</html>
